<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0c11">
<title>Shift Schedule</title>
<style>
  :root{
    --bg:#0a0c11; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.07);
    --line:rgba(255,255,255,.09); --text:#eef1f7; --muted:#9aa3b5; --accent:#5ee0ff;
    --morning:#ffb020; --night:#7b6cff; --home1:#22c58b; --home2:#129b78;
    --radius:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{font-size:clamp(16px, 0.6vw + 12px, 22px)}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(94,224,255,.10), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(123,108,255,.12), transparent 60%),
      var(--bg);
    color:var(--text); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:clamp(12px,2.5vw,40px);
  }
  button,select,input{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .wrap{max-width:1680px;margin:0 auto}

  /* Header */
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:clamp(14px,2vw,28px)}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.25rem;letter-spacing:.3px}
  .logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--night));color:#0a0c11;font-size:1.2rem}
  .lang{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-height:48px}
  .lang option{background:#151924}

  /* Layout */
  .layout{display:grid;gap:clamp(14px,2vw,28px)}
  @media(min-width:1100px){.layout{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}
    .day-panel{position:sticky;top:20px}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:clamp(14px,2vw,28px);backdrop-filter:blur(12px)}

  /* Day navigator */
  .daynav{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
  .big-btn{min-width:64px;min-height:64px;border-radius:18px;border:1px solid var(--line);
    background:var(--panel2);font-size:1.6rem;transition:transform .12s,background .2s}
  .big-btn:hover{background:rgba(255,255,255,.12)}
  .big-btn:active{transform:scale(.94)}
  .date-center{text-align:center;user-select:none}
  .rel{display:inline-block;font-size:.85rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    padding:5px 12px;border-radius:999px;background:rgba(94,224,255,.12);color:var(--accent);margin-bottom:6px}
  .rel.past{background:rgba(255,255,255,.07);color:var(--muted)}
  .date-main{font-size:clamp(1.5rem,3.2vw,2.3rem);font-weight:800;line-height:1.15}
  .date-week{color:var(--muted);font-size:1.05rem;margin-top:2px}

  .quick{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .pill{flex:1 1 140px;min-height:52px;border-radius:14px;border:1px solid var(--line);
    background:var(--panel2);font-weight:700;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:8px}
  .pill.primary{background:linear-gradient(135deg,rgba(94,224,255,.25),rgba(123,108,255,.25));border-color:rgba(94,224,255,.4)}
  .pill:disabled{opacity:.4;cursor:default}
  input[type=date]{color-scheme:dark;background:var(--panel2);border:1px solid var(--line);border-radius:14px;
    min-height:52px;padding:0 14px;flex:1 1 180px}

  /* Person cards */
  .people{display:grid;gap:12px;margin-top:18px}
  .card{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;
    padding:16px;border-radius:18px;background:var(--panel2);border:1px solid var(--line);
    border-left:6px solid var(--pc)}
  .icon{width:clamp(56px,6vw,72px);height:clamp(56px,6vw,72px);border-radius:18px;display:grid;place-items:center;
    font-size:clamp(1.7rem,3vw,2.2rem);background:color-mix(in srgb,var(--sc) 22%,transparent);
    box-shadow:0 0 24px color-mix(in srgb,var(--sc) 30%,transparent)}
  .pname{font-size:1rem;color:var(--muted);font-weight:600}
  .shift{font-size:clamp(1.25rem,2.4vw,1.6rem);font-weight:800;color:var(--sc);line-height:1.2}
  .time{font-size:1rem;margin-top:2px}
  .next{font-size:.88rem;color:var(--muted);margin-top:6px}
  .hint{color:var(--muted);font-size:.8rem;text-align:center;margin-top:14px}
  @media(hover:none){.hint{display:none}}

  /* Calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .cal-title{font-size:clamp(1.2rem,2.2vw,1.6rem);font-weight:800;text-align:center;flex:1}
  .sq{min-width:52px;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-size:1.3rem}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(3px,.5vw,8px)}
  .wd{text-align:center;color:var(--muted);font-size:.8rem;font-weight:700;padding:6px 0;text-transform:uppercase}
  .cell{background:rgba(255,255,255,.03);border:1px solid transparent;border-radius:12px;
    padding:clamp(4px,.6vw,10px);min-height:clamp(70px,9vw,118px);text-align:left;
    display:flex;flex-direction:column;gap:4px;transition:background .15s,border-color .15s}
  .cell:hover{background:rgba(255,255,255,.07)}
  .cell.other{opacity:.35}
  .cell.today .num{background:var(--accent);color:#0a0c11;border-radius:8px;padding:0 6px}
  .cell.sel{border-color:var(--accent);background:rgba(94,224,255,.08)}
  .num{font-weight:800;font-size:.95rem;align-self:flex-start}
  .bars{display:flex;flex-direction:column;gap:3px;margin-top:auto}
  .bar{height:clamp(8px,1.4vw,20px);border-radius:5px;background:var(--sc);
    border-left:4px solid var(--pc);font-size:.68rem;font-weight:800;color:#0a0c11;
    display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
  @media(max-width:640px){.bar{font-size:0;border-left-width:3px}}

  .legend{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:16px;font-size:.88rem;color:var(--muted)}
  .lg{display:flex;align-items:center;gap:8px}
  .sw{width:18px;height:18px;border-radius:5px}
  .order{margin-top:10px;font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}
  .order b{color:var(--text)}

  @media(max-width:480px){
    .big-btn{min-width:54px;min-height:54px}
    .card{gap:12px;padding:12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo">◐</div><span id="tTitle">Shift Schedule</span></div>
    <select class="lang" id="lang" aria-label="Language">
      <option value="en">🌐 English</option>
      <option value="az">🌐 Azərbaycan</option>
      <option value="ru">🌐 Русский</option>
    </select>
  </header>

  <div class="layout">
    <!-- DAY PANEL -->
    <section class="panel day-panel" id="dayPanel" aria-live="polite">
      <div class="daynav">
        <button class="big-btn" id="prevDay" aria-label="Previous day">◀</button>
        <div class="date-center">
          <span class="rel" id="rel">Today</span>
          <div class="date-main" id="dateMain"></div>
          <div class="date-week" id="dateWeek"></div>
        </div>
        <button class="big-btn" id="nextDay" aria-label="Next day">▶</button>
      </div>
      <div class="quick">
        <button class="pill primary" id="todayBtn">⟲ <span id="tToday">Today</span></button>
        <input type="date" id="picker" aria-label="Pick a date">
      </div>
      <div class="people" id="people"></div>
      <div class="hint" id="tHint"></div>
    </section>

    <!-- CALENDAR PANEL -->
    <section class="panel">
      <div class="cal-head">
        <button class="sq" id="prevMonth" aria-label="Previous month">‹</button>
        <div class="cal-title" id="calTitle"></div>
        <button class="sq" id="nextMonth" aria-label="Next month">›</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend" id="legend"></div>
      <div class="order" id="order"></div>
    </section>
  </div>
</div>

<script>
/* ================= SETTINGS (edit here) ================= */
// Reference date: 13 Oct 2025. offset decides each person's place in the 4-day cycle.
// Cycle: 0 = Morning, 1 = Night, 2 = Home 1, 3 = Home 2
const REF = Date.UTC(2025, 9, 13);
const PEOPLE = [
  { id:'elshad', name:'Elshad Ildarov', offset:0,  color:'#ff5c7a' },
  { id:'elvin',  name:'Elvin Mammadov', offset:0,  color:'#b388ff' }, // moved to Elshad's shift
  { id:'eli',    name:'Eli Babayev',    offset:-1, color:'#ffb547' }
];
/* ======================================================== */

const CYCLE = ['morning','night','home1','home2'];
const SHIFT_UI = {
  morning:{icon:'☀️', color:'var(--morning)'},
  night:  {icon:'🌙', color:'var(--night)'},
  home1:  {icon:'🏠', color:'var(--home1)'},
  home2:  {icon:'🛋️', color:'var(--home2)'}
};

const T = {
  en:{title:'Shift Schedule',today:'Today',yesterday:'Yesterday',tomorrow:'Tomorrow',
      inDays:n=>`In ${n} days`,ago:n=>`${n} days ago`,
      morning:'Morning shift',night:'Night shift',home1:'Day off · 1',home2:'Day off · 2',
      morningTime:'08:00 – 20:00',nightTime:'20:00 – 08:00',offTime:'Resting at home',
      next:'Tomorrow',short:{morning:'M',night:'N',home1:'H1',home2:'H2'},
      hint:'Tip: use ← → keys to change day, T for today',order:'Bar order:',
      wd:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
      wdLong:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],
      months:['January','February','March','April','May','June','July','August','September','October','November','December']},
  az:{title:'Növbə Cədvəli',today:'Bu gün',yesterday:'Dünən',tomorrow:'Sabah',
      inDays:n=>`${n} gün sonra`,ago:n=>`${n} gün əvvəl`,
      morning:'Səhər növbəsi',night:'Gecə növbəsi',home1:'İstirahət · 1',home2:'İstirahət · 2',
      morningTime:'08:00 – 20:00',nightTime:'20:00 – 08:00',offTime:'Evdə istirahət',
      next:'Sabah',short:{morning:'S',night:'G',home1:'E1',home2:'E2'},
      hint:'Məsləhət: günü dəyişmək üçün ← → düymələri, bu gün üçün T',order:'Sıra:',
      wd:['B.e','Ç.a','Ç.','C.a','C.','Ş.','B.'],
      wdLong:['Bazar','Bazar ertəsi','Çərşənbə axşamı','Çərşənbə','Cümə axşamı','Cümə','Şənbə'],
      months:['Yanvar','Fevral','Mart','Aprel','May','İyun','İyul','Avqust','Sentyabr','Oktyabr','Noyabr','Dekabr']},
  ru:{title:'График смен',today:'Сегодня',yesterday:'Вчера',tomorrow:'Завтра',
      inDays:n=>`Через ${n} дн.`,ago:n=>`${n} дн. назад`,
      morning:'Дневная смена',night:'Ночная смена',home1:'Выходной · 1',home2:'Выходной · 2',
      morningTime:'08:00 – 20:00',nightTime:'20:00 – 08:00',offTime:'Отдых дома',
      next:'Завтра',short:{morning:'Д',night:'Н',home1:'В1',home2:'В2'},
      hint:'Совет: ← → для смены дня, T — сегодня',order:'Порядок:',
      wd:['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],
      wdLong:['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'],
      months:['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь']}
};

let lang = 'en';
try { lang = localStorage.getItem('shiftLang') || 'en'; } catch(e){}
if(!T[lang]) lang='en';

const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const dayNum = d => Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()) - REF) / 864e5);
const shiftOf = (d,p) => CYCLE[(((dayNum(d)+p.offset)%4)+4)%4];
const sameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

let today = startOfDay(new Date());
let selected = today;
let viewY = today.getFullYear(), viewM = today.getMonth();

const $ = id => document.getElementById(id);

function timeText(s,t){ return s==='morning'?t.morningTime : s==='night'?t.nightTime : t.offTime; }

function renderDay(){
  const t = T[lang];
  const diff = dayNum(selected) - dayNum(today);
  const rel = $('rel');
  rel.textContent = diff===0?t.today : diff===1?t.tomorrow : diff===-1?t.yesterday : diff>0?t.inDays(diff):t.ago(-diff);
  rel.className = 'rel' + (diff<0?' past':'');
  $('dateMain').textContent = `${selected.getDate()} ${t.months[selected.getMonth()]} ${selected.getFullYear()}`;
  $('dateWeek').textContent = t.wdLong[selected.getDay()];
  $('picker').value = iso(selected);
  $('todayBtn').disabled = diff===0;

  const tmr = addDays(selected,1);
  $('people').innerHTML = PEOPLE.map(p=>{
    const s = shiftOf(selected,p), n = shiftOf(tmr,p), ui = SHIFT_UI[s];
    return `<div class="card" style="--pc:${p.color};--sc:${ui.color}">
      <div class="icon" aria-hidden="true">${ui.icon}</div>
      <div>
        <div class="pname">${p.name}</div>
        <div class="shift">${t[s]}</div>
        <div class="time">${timeText(s,t)}</div>
        <div class="next">${t.next}: ${SHIFT_UI[n].icon} ${t[n]}</div>
      </div></div>`;
  }).join('');
}

function renderCalendar(){
  const t = T[lang];
  $('calTitle').textContent = `${t.months[viewM]} ${viewY}`;
  const first = new Date(viewY, viewM, 1);
  const lead = (first.getDay()+6)%7;               // Monday first
  const start = addDays(first, -lead);
  const daysInMonth = new Date(viewY, viewM+1, 0).getDate();
  const total = Math.ceil((lead + daysInMonth)/7)*7;

  let html = t.wd.map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<total;i++){
    const d = addDays(start,i);
    const cls = ['cell'];
    if(d.getMonth()!==viewM) cls.push('other');
    if(sameDay(d,today)) cls.push('today');
    if(sameDay(d,selected)) cls.push('sel');
    const bars = PEOPLE.map(p=>{
      const s = shiftOf(d,p);
      return `<div class="bar" style="--pc:${p.color};--sc:${SHIFT_UI[s].color}" title="${p.name}: ${t[s]}">${t.short[s]}</div>`;
    }).join('');
    html += `<button type="button" class="${cls.join(' ')}" data-d="${iso(d)}" aria-label="${d.getDate()} ${t.months[d.getMonth()]}">
      <span class="num">${d.getDate()}</span><div class="bars">${bars}</div></button>`;
  }
  $('grid').innerHTML = html;

  $('legend').innerHTML = CYCLE.map(s=>
    `<span class="lg"><span class="sw" style="background:${SHIFT_UI[s].color}"></span>${SHIFT_UI[s].icon} ${t[s]}</span>`).join('');
  $('order').innerHTML = `<span>${t.order}</span>` + PEOPLE.map((p,i)=>
    `<span class="lg"><span class="sw" style="background:${p.color}"></span><b>${i+1}.</b> ${p.name}</span>`).join('');
}

function renderStatic(){
  const t = T[lang];
  document.documentElement.lang = lang;
  $('tTitle').textContent = t.title;
  $('tToday').textContent = t.today;
  $('tHint').textContent = t.hint;
  $('lang').value = lang;
}

function render(){ renderStatic(); renderDay(); renderCalendar(); }

function select(d, followMonth=true){
  selected = startOfDay(d);
  if(followMonth){ viewY = selected.getFullYear(); viewM = selected.getMonth(); }
  renderDay(); renderCalendar();
}

/* Events */
$('prevDay').addEventListener('click',()=>select(addDays(selected,-1)));
$('nextDay').addEventListener('click',()=>select(addDays(selected,1)));
$('todayBtn').addEventListener('click',()=>select(today));
$('picker').addEventListener('change',e=>{
  const [y,m,d] = e.target.value.split('-').map(Number);
  if(y&&m&&d) select(new Date(y,m-1,d));
});
$('prevMonth').addEventListener('click',()=>{ viewM--; if(viewM<0){viewM=11;viewY--;} renderCalendar(); });
$('nextMonth').addEventListener('click',()=>{ viewM++; if(viewM>11){viewM=0;viewY++;} renderCalendar(); });
$('grid').addEventListener('click',e=>{
  const c = e.target.closest('.cell'); if(!c) return;
  const [y,m,d] = c.dataset.d.split('-').map(Number);
  select(new Date(y,m-1,d));
  if(window.innerWidth<1100) $('dayPanel').scrollIntoView({behavior:'smooth',block:'start'});
});
$('lang').addEventListener('change',e=>{
  lang = e.target.value;
  try{ localStorage.setItem('shiftLang',lang); }catch(err){}
  render();
});

/* Keyboard */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.key==='ArrowLeft') select(addDays(selected,-1));
  else if(e.key==='ArrowRight') select(addDays(selected,1));
  else if(e.key==='t'||e.key==='T') select(today);
});

/* Swipe on day panel (phones) */
let sx=null, sy=null;
$('dayPanel').addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
$('dayPanel').addEventListener('touchend',e=>{
  if(sx===null) return;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) select(addDays(selected, dx<0?1:-1));
  sx=sy=null;
},{passive:true});

/* Auto-update "today" after midnight */
setInterval(()=>{
  const now = startOfDay(new Date());
  if(!sameDay(now,today)){ const wasToday = sameDay(selected,today); today = now; if(wasToday) selected = now; render(); }
}, 60000);

render();
</script>
</body>
</html>
